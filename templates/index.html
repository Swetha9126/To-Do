<!DOCTYPE html>
<html>

<head>
  <title>Todo List App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/index.css">
</head>

<body>
  <div class="container">
    <div class="container_button">
      <div>
      <h1>Todo Application
      <h4 class="subtitle">List of Tasks</h4>
      </h1>
      </div>
      <div class="backdiv">
      <a href="/index" class="backbutton"><span style='font-size:20px;'>&#8592;</span>Back </a>
        </div>
    </div> 
    <div class="status">
      <div class="card">Lists<br><b>{{ lists_count }}</b></div>
      <div class="card">Total Tasks<br><b>{{ total_tasks }}</b></div>
      <div class="card">Completed<br><b>{{ completed_tasks }}</b></div>
    </div>
    <div class="functions">
      <form action="/add_list" method="POST">
        <input type="text" name="list_name" placeholder="New list" required>
        <button class="button">Add List</button>
      </form>
      <form action="/search_list" method="POST">
        <input type="text" name="search_list" placeholder="Search List" required class="functions_a">
        <button class="button">Search</button>
      </form>
    </div>
    <br>
    <div class="lists">
      {% for list in lists %}
      <div class="list">
        <div class="slist">
          <a href="/viewlist/{{ list.id }}">{{ list.name }} ({{ list.task_count }})</a>
          <span class="but">
            <button>
              <a href="/delete_list/{{ list.id }}"
                onclick="return confirm('Delete this list and all its tasks?')">Delete</a>
            </button>
          </span>
        </div>
        {% endfor %}
      </div>
    </div>

</body>

</html>
